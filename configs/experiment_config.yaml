# AdaPrune 实验配置

# 通用设置
general:
  random_seed: 42
  n_jobs: -1
  verbose: 1

# 模型设置
model:
  n_estimators: 200
  learning_rate: 0.1
  validation_fraction: 0.2
  early_stopping_rounds: 30

# 自适应策略设置
adaptation:
  frequency: 5
  strategies:
    - gap_based
    - trend_based
    - data_aware
    - hybrid

# Gap-Based 策略参数
gap_based:
  gap_threshold: 0.05
  trend_threshold: 0.001
  depth_step: 1
  samples_factor: 1.5

# Trend-Based 策略参数
trend_based:
  improvement_threshold: 0.001
  plateau_patience: 5

# Data-Aware 策略参数
data_aware:
  base_gap_threshold: 0.05
  base_depth_step: 1

# 实验设置
experiment:
  n_folds: 5
  test_size: 0.2
  metrics:
    - accuracy
    - f1_weighted
    - roc_auc

# 基线方法
baselines:
  - rf_default
  - xgb_default
  - xgb_tuned
  - lgbm_default
  - xgb_early_stopping
